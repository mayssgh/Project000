# Bake-off configuration.
# Fill in / adjust model names and pricing before running.
# Pricing changes over time -- verify current $/1M tokens on the provider's
# pricing page before you compute cost.csv, don't trust old numbers blindly.

models:
  top_api:
    label: "openai/gpt-oss-120b"    # free-tier stand-in for the top API model (via Groq)
    provider: free_api
    free_provider: groq
    model_id: "openai/gpt-oss-120b"
    price_per_m_input: 0.00
    price_per_m_output: 0.00

  cheap_api:
    label: "openai/gpt-oss-20b"     # smaller/faster Groq model, distinct from top_api
    provider: free_api
    free_provider: groq
    model_id: "openai/gpt-oss-20b"
    price_per_m_input: 0.00
    price_per_m_output: 0.00

  local_oss:
    label: "qwen2.5:3b"
    provider: ollama
    model_id: "qwen2.5:3b"
    ollama_host: "http://localhost:11434"
    # local cost is computed from hardware, not token pricing -- see cost.py

run:
  temperature: 0
  max_tokens: 300
  n_repeats_for_latency: 1

local_hardware:
  description: "e.g. M2 MacBook Air, 16GB RAM"
  hourly_cost_usd: 0.00
